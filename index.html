<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué diablos quieres?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1d1d1b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 🔥 PATTERN (MODO DEBUG) */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('logo/pattern.svg');
            background-repeat: repeat;
            background-size: 120px;

            /* 👇 IMPORTANTE: subir para verificar */
            opacity: 0.25;

            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 100%;
            max-width: 250px;
        }

        .description {
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.6;
        }

        .buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 48px;
            padding: 14px 24px;
            background-color: #b01917;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .icon {
            width: 22px;
            height: 22px;
        }

        .icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Glow */
        .menu:hover,
        .instagram:hover,
        .tiktok:hover,
        .ubicacion:hover {
            box-shadow: 0 10px 30px rgba(193, 53, 132, 0.5);
        }

        .whatsapp {
            background-color: #25D366;
        }

        .whatsapp:hover {
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
        }

    </style>
</head>

<body>

    <main class="container">

        <img src="logo/logo-que-diablos-quieres.png" class="logo">

        <p class="description">
            Conoce nuestras promos, novedades y sorpresas especiales.

            <br>
            Discover our promos, news, and special surprises.
        </p>

        <nav class="buttons">

            <a href="resources/menu.pdf" class="btn menu">
                <span class="icon"><img src="logo/menu.svg"></span>
                Menú Digital
            </a>

            <a href="#" class="btn instagram">
                <span class="icon"><img src="logo/instagram.svg"></span>
                Instagram
            </a>

            <a href="#" class="btn tiktok">
                <span class="icon"><img src="logo/tiktok.svg"></span>
                TikTok
            </a>

            <a href="#" class="btn ubicacion">
                <span class="icon"><img src="logo/ubicacion.svg"></span>
                Ubicación
            </a>

            <a href="#" class="btn whatsapp">
                <span class="icon"><img src="logo/whatsapp.svg"></span>
                WhatsApp
            </a>

        </nav>

    </main>

</body>
</html>
