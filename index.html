<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué diablos quieres?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1d1d1b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* LOGO */
        .logo {
            width: 100%;
            max-width: 250px;
            animation: logoEntrance 0.8s ease-out forwards;
        }

        @keyframes logoEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* DESCRIPCIÓN */
        .description {
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.6;

            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .description span {
            display: block;
            font-size: 0.85rem;
            opacity: 0.75;
            margin-top: 4px;
        }

        /* BOTONES */
        .buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;

            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.6s forwards;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 14px 24px;
            background-color: #b01917;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px rgba(176, 25, 23, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* ANIMACIÓN GENERAL */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>
    <main class="container">

        <img src="logo/logo-que-diablos-quieres.png" class="logo">

        <p class="description">
            Conoce nuestras promos, novedades y sorpresas especiales.
            <span>Discover our promos, news, and special surprises.</span>
        </p>

        <nav class="buttons">

            <a href="resources/menu.pdf" target="_blank" class="btn">
                Menú Digital
            </a>

            <a href="https://www.instagram.com/quediablosquieres.food/" target="_blank" class="btn">
                Instagram
            </a>

            <a href="https://www.tiktok.com/@quediablosquieres" target="_blank" class="btn">
                TikTok
            </a>

            <a href="https://maps.app.goo.gl/kcZ4TGXjyQTEF9aRA" target="_blank" class="btn">
                Ubicación
            </a>

        </nav>

    </main>
</body>
</html>
